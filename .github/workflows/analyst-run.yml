name: analyst-run

on:
  workflow_dispatch:
    inputs:
      target_agent:
        description: "Целевой агент"
        required: true
        default: "langgraph"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-analyst.txt
      - name: Run analysis
        run: |
          python scripts/run_analysis.py \
            --format robustness_report \
            --report data/robustness_report.json \
            --enriched data/clean/v0.1_enriched.jsonl \
            --mutations data/calibration/manual_mutations.jsonl \
            --target-agent "${{ github.event.inputs.target_agent }}" \
            --out reports/robustness_profile.md \
            --metrics-json reports/metrics.json \
            --feedback-json reports/feedback_to_mutator.json
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: analyst-reports
          path: reports/
