name: create_robustness-run

on:
  workflow_dispatch: # Позволяет запускать по кнопке

jobs:
  run-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешает коммитить файлы обратно в репозиторий
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Eval Script
        env:
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
        run: python scripts/run_eval.py
        
      - name: Commit and Push report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/robustness_report.json
          git commit -m "chore: auto-generate robustness_report.json" || echo "No changes"
          git push
