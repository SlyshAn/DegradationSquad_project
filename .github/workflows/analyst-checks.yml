name: analyst-checks

on:
  push:
    branches: [main, "feature/analyst-*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-analyst.txt
      - name: Run tests
        run: pytest -q
      - name: Compile Python
        run: python -m compileall -q scripts
